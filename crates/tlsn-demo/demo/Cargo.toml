[package]
name = "webproof-tlsn-demo"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "WebProof TLSNotary binaries: spike, notarize, verify-and-sign"

[dependencies]
webproof-tlsn = { workspace = true, features = ["fixture"] }
webproof-verifier.workspace = true
tlsn-server-fixture-certs.workspace = true

anyhow.workspace = true
bincode.workspace = true
bs58.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
rand.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[[bin]]
name = "spike"
path = "src/bin/spike.rs"

[[bin]]
name = "webproof-notarize"
path = "src/bin/webproof_notarize.rs"

[[bin]]
name = "webproof-verify-sign"
path = "src/bin/webproof_verify_sign.rs"
