[workspace]
resolver = "2"
members = ["webproof-tlsn", "demo"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"

[workspace.dependencies]
# TLSNotary, pinned to release tag v0.1.0-alpha.15.
# These crates are not published on crates.io (they depend on git-only
# tlsn-utils and mpz revisions), so they must be git dependencies pinned to
# the exact release commit. See ../../docs/tlsnotary-version.md.
tlsn = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec" }
tlsn-formats = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec" }
tlsn-server-fixture = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec" }
tlsn-server-fixture-certs = { git = "https://github.com/tlsnotary/tlsn", rev = "47aee45b53e06648c1b2ad3689b367b8c923fdec" }

webproof-core = { path = "../webproof-core" }
webproof-verifier = { path = "../webproof-verifier" }
webproof-tlsn = { path = "webproof-tlsn" }

anyhow = "1"
# bincode 1.3 matches the serialization used by the official TLSNotary
# examples to persist attestations/presentations.
bincode = "1.3"
bs58 = "0.5"
ed25519-dalek = "2.1.1"
futures = "0.3"
hex = "0.4.3"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["full"] }
k256 = { version = "0.13", features = ["ecdsa"] }
rand = "0.8.5"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
thiserror = "2.0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "fs", "io-util"] }
tokio-util = { version = "0.7", features = ["compat"] }
tracing = "0.1"
tracing-subscriber = "0.3"
url = "2.5.4"

# The MPC protocol is far too slow in unoptimized builds; keep dependencies
# optimized even for `cargo run` in the dev profile (same approach as the
# upstream tlsn workspace).
[profile.dev.package."*"]
opt-level = 3
