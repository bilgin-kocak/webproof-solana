[package]
name = "webproof-tlsn"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Real TLSNotary integration for WebProof: notarize an HTTPS GET, build a presentation, and verify it into VerifiedTlsData"

[features]
# Enables the in-process HTTPS test server used by the local demo and tests.
fixture = ["dep:tlsn-server-fixture"]

[dependencies]
tlsn.workspace = true
tlsn-formats.workspace = true
tlsn-server-fixture = { workspace = true, optional = true }
tlsn-server-fixture-certs.workspace = true

webproof-verifier.workspace = true

anyhow.workspace = true
bincode.workspace = true
futures.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
k256.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
webproof-core.workspace = true
ed25519-dalek.workspace = true
sha2.workspace = true
url.workspace = true
